name: WhyMove Daily Email

on:
  schedule:
    - cron: "30 18 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout WhyMove
        uses: actions/checkout@v7

      - name: Checkout DartCopilot
        uses: actions/checkout@v7
        with:
          repository: junhw8670/DartCopilot
          path: DartCopilot

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore KR market cache
        uses: actions/cache/restore@v4
        with:
          path: cache/kr_ohlcv.parquet
          key: kr-ohlcv-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            kr-ohlcv-${{ runner.os }}-

      - name: Update KR market cache
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python -m app.kr_cache

      - name: Save KR market cache
        uses: actions/cache/save@v4
        with:
          path: cache/kr_ohlcv.parquet
          key: kr-ohlcv-${{ runner.os }}-${{ github.run_id }}
      
      - name: Generate and send report
        env:
          LLM_BACKEND: cloud
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          WATCHLIST_KR: ${{ vars.WATCHLIST_KR }}
          WATCHLIST_US: ${{ vars.WATCHLIST_US }}
          
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}

          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}

          DART_MCP_PATH: ${{ github.workspace }}/DartCopilot/mcp_servers/dart_server.py
          DART_INDUSTRY_PATH: ${{ github.workspace }}/DartCopilot/cache/industry_codes.json

          EDGAR_USER_AGENT: WhyMove research junhw8670@gmail.com

        run: python daily_email.py